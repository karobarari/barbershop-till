services:
  - type: web
    name: barbershop-till
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: barbershop-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: TILL_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: barbershop-db
    plan: free
    region: frankfurt
